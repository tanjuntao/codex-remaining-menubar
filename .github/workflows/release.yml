name: Release macOS DMG

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/zsh -e {0}

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ '^[0-9]+\.[0-9]+\.[0-9]+$' ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build universal DMG
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package-dmg.sh

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          (
            cd dist
            shasum -a 256 -c "Codex-Remaining-${VERSION}.dmg.sha256"
          )
          architectures="$(lipo -archs "dist/Codex Remaining.app/Contents/MacOS/CodexRemainingMenuBar")"
          [[ " ${architectures} " == *" arm64 "* ]]
          [[ " ${architectures} " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "dist/Codex Remaining.app"
          hdiutil verify "dist/Codex-Remaining-${VERSION}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Codex-Remaining-${VERSION}.dmg#Codex Remaining ${VERSION} (Universal DMG)" \
            "dist/Codex-Remaining-${VERSION}.dmg.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "Codex Remaining ${VERSION}"
